<div>
   <!-- Esta es nuestra plantilla html lo que vamos a ver: una lista y un formulario -->
   <!-- Título principal de la página -->
    <h1>MIS SUPERHEROES FAVORITOS</h1>
  
    <h2>Lista de super heroes </h2>
    <ul>
      <li *ngFor="let heroe of heroes">
        {{ heroe.id }} {{ heroe.nombre }} - <strong>Power:</strong> {{ heroe.poder }}
         <!-- llamamos al metodo eliminar que hemos definido en el archivo.ts -->
        <button (click)="eliminarHeroe(heroe.id)">Eliminar</button>
      </li>
    </ul>
  
    <h2>Crea tu super heroe</h2>
<input [(ngModel)]="nuevoHeroe.nombre" placeholder="Nombre" />
<input [(ngModel)]="nuevoHeroe.poder" placeholder="Poder" type="number" />
<!-- Agregar type="submit" para que el estilo CSS se aplique -->
<button type="submit" (click)="agregarHeroe()">Agregar</button>
</div>
